plugins {
    id 'net.neoforged.moddev' version '2.0.78'
    id 'maven-publish'
}

repositories {
    def localRepository = mavenLocal()
    remove(localRepository)
    add(0, localRepository)
}

version = project.mod_version
group = project.group

base {
    archivesName = "${mod_name}-${minecraft_version}-neoforge"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

neoForge {
    version = project.neoforge_version

    accessTransformers.from(file('src/main/resources/META-INF/accesstransformer.cfg'))

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        voxy {
            sourceSet sourceSets.main
        }
    }
}

configurations {
    // Libraries packaged into the final jar (flat-merged).
    internal {
        canBeResolved = true
        canBeConsumed = false
    }
    implementation.extendsFrom internal
}

dependencies {
    // === Sodium / Iris / Lithium / Chunky (compileOnly) ===
    compileOnly files('libs/sodium-neoforge-0.8.12-SNAPSHOT+mc1.21.1-local-mod.jar')
    compileOnly files('libs/sodium-neoforge-0.8.12-SNAPSHOT+mc1.21.1-local-api.jar')
    compileOnly files('libs/iris-neoforge-1.8.12+mc1.21.1.jar')
    compileOnly files('libs/lithium-neoforge-0.15.3+mc1.21.1.jar')
    compileOnly files('libs/Chunky-NeoForge-1.4.23.jar')
    compileOnly files('libs/vivecraft-1.21.9-1.3.2-neoforge.jar')

    // === Bundled libraries (extracted from voxy-0.2.13 jar's META-INF/jarjar) ===
    internal files(
        'libs/bundled/commons-pool2-2.12.0.jar',
        'libs/bundled/jedis-5.1.0.jar',
        'libs/bundled/lwjgl-lmdb-3.3.3.jar',
        'libs/bundled/lwjgl-zstd-3.3.3.jar',
        'libs/bundled/rocksdbjni-10.2.1-win64.jar',
        'libs/bundled/xz-1.10.jar'
    )
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 25
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

// Bundle internal dependencies (flat-merged) plus native libs already in resources.
jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from('LICENSE') {
        rename { "${it}_${mod_name}" }
    }
    from {
        configurations.internal.collect { file ->
            zipTree(file)
        }
    }
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'module-info.class'
}
